name: Scarica dati Garmin

# Parte dal pulsante "Scarica da Garmin" della dashboard (o a mano da GitHub).
# E' l'unico download automatico: scarica, cifra GPS e salute, pubblica.
# (scripts/scarica_garmin.py si puo' sempre lanciare anche a mano dal PC.) Il repo e' pubblico, quindi anche questi log: lo script stampa
# solo avvisi ed errori, mai i dati delle corse.
on:
  workflow_dispatch:

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: pip install --quiet garminconnect==0.3.3 curl_cffi==0.15.0 cryptography==46.0.3 pillow==12.1.1 requests==2.32.5

      - name: Scarica, cifra e pubblica
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
          MAP_PASSWORD: ${{ secrets.MAP_PASSWORD }}
          REPO_PATH: ${{ github.workspace }}
          GARMIN_TOKENS_OUT: ${{ runner.temp }}/garmin_tokens.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/scarica_garmin.py

      # Il token d'accesso dura circa un giorno e Garmin lo rinnova a ogni giro:
      # si salva quello nuovo, altrimenti la volta dopo il login fallisce.
      - name: Salva il token Garmin rinnovato
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          TOKENS_FILE: ${{ runner.temp }}/garmin_tokens.json
        run: |
          if [ -s "$TOKENS_FILE" ]; then
            gh secret set GARMINTOKENS --repo "$GITHUB_REPOSITORY" < "$TOKENS_FILE"
          fi
          rm -f "$TOKENS_FILE"
